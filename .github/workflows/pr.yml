name: pr

on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Sync
        run: uv sync --all-groups
      - name: Ruff changed Python files
        run: |
          changed="$(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" HEAD -- '*.py')"
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed" | xargs uv run ruff check
          fi
      - name: Pytest
        run: uv run pytest
